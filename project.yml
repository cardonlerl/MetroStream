name: MetroStream
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MetroStream:
    type: application
    platform: iOS
    sources:
      - MetroStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.sardinecan
        PRODUCT_NAME: MetroStream
        PRODUCT_MODULE_NAME: MetroStream
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 沙丁鱼罐头
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于推荐附近站点
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  MetroStreamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MetroStreamTests
    dependencies:
      - target: MetroStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.sardinecan.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MetroStream:
    build:
      targets:
        MetroStream: all
        MetroStreamTests: [test]
    test:
      targets:
        - MetroStreamTests
